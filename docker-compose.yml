services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: lightrag
    ports:
      - "${PG_PORT:-127.0.0.1:5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d lightrag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    ports:
      - "${VALKEY_PORT:-127.0.0.1:6380}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  lightrag:
    image: rag-deploy-lightrag:latest
    build: ./lightrag-service
    environment:
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      EMBEDDING_PROVIDER: gemini
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_DIM: "768"
      OCR_PROVIDER: gemini
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: raguser
      PG_PASSWORD: ragpass
      PG_DATABASE: lightrag
      # Vertex AI (set USE_VERTEX_AI=true in .env to use GCP credit)
      USE_VERTEX_AI: ${USE_VERTEX_AI:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-sa.json
    ports:
      - "${LIGHTRAG_PORT:-127.0.0.1:8007}:8007"
    volumes:
      - lightrag-data:/app/data
      - ./seed-data/graph_chunk_entity_relation.graphml:/app/seed/graph_chunk_entity_relation.graphml:ro
      - ${GCP_SA_KEY_FILE:-/dev/null}:/app/gcp-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  crm-service:
    image: rag-deploy-crm:latest
    build: ./crm-service
    profiles: ["prod"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-3-flash-preview
      DATABASE_URL: postgresql://raguser:ragpass@postgres:5432/lightrag
      SALESFORCE_INSTANCE_URL: ${SALESFORCE_INSTANCE_URL:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      KINTONE_SUBDOMAIN: ${KINTONE_SUBDOMAIN:-}
      KINTONE_API_TOKEN: ${KINTONE_API_TOKEN:-}
      KINTONE_APP_ID: ${KINTONE_APP_ID:-}
      # Vertex AI
      USE_VERTEX_AI: ${USE_VERTEX_AI:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-sa.json
    volumes:
      - ${GCP_SA_KEY_FILE:-/dev/null}:/app/gcp-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensandbox:
    image: rag-deploy-opensandbox:latest
    build: ./opensandbox
    profiles: ["prod"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sandbox-python:
    image: sandbox-python:latest
    build:
      context: ./opensandbox
      dockerfile: Dockerfile.sandbox-python
    profiles: ["build"]

  task-worker:
    image: rag-deploy-task-worker:latest
    build: ./task-worker
    profiles: ["prod"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-3-flash-preview
      DATABASE_URL: postgresql://raguser:ragpass@postgres:5432/lightrag
      REDIS_URL: redis://valkey:6379
      LIGHTRAG_URL: http://lightrag:8007
      CRM_SERVICE_URL: http://crm-service:8009
      RAG_UI_URL: http://rag-ui:3000
      OPENSANDBOX_URL: opensandbox:8080
      SANDBOX_PYTHON_IMAGE: sandbox-python:latest
      APP_URL: ${APP_URL:?APP_URL is required}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      # Vertex AI
      USE_VERTEX_AI: ${USE_VERTEX_AI:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-sa.json
    volumes:
      - ${GCP_SA_KEY_FILE:-/dev/null}:/app/gcp-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      lightrag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rag-ui:
    image: rag-deploy-ui:latest
    build: ./rag-ui
    profiles: ["prod"]
    environment:
      LIGHTRAG_URL: http://lightrag:8007
      REDIS_URL: redis://valkey:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-3-flash-preview
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_PROVIDER: gemini
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PW: ${PW:-}
      DATABASE_URL: postgresql://raguser:ragpass@postgres:5432/lightrag
      CHAT_FILES_DIR: /app/data/chat-files
      KB_FILES_DIR: /app/data/kb-files
      CRM_SERVICE_URL: http://crm-service:8009
      TASK_WORKER_URL: http://task-worker:8010
      # Vertex AI
      USE_VERTEX_AI: ${USE_VERTEX_AI:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-sa.json
    ports:
      - "4002:3000"
    volumes:
      - chat-files:/app/data/chat-files
      - kb-files:/app/data/kb-files
      - ${GCP_SA_KEY_FILE:-/dev/null}:/app/gcp-sa.json:ro
    depends_on:
      lightrag:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  lightrag-data:
  chat-files:
  kb-files:
