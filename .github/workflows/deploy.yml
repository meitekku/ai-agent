name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Orange Pi（個人 origin: wgzhaocv/rag-deploy） ──
  deploy-orangepi:
    if: github.repository == 'wgzhaocv/rag-deploy'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: |
          docker compose --profile prod build
          docker build -f opensandbox/Dockerfile.sandbox-python -t sandbox-python:latest opensandbox/

      - name: Save images
        run: docker save -o /tmp/rag-images.tar rag-deploy-lightrag:latest rag-deploy-ui:latest rag-deploy-crm:latest rag-deploy-task-worker:latest rag-deploy-opensandbox:latest sandbox-python:latest

      - name: Sync files to Orange Pi
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # Write deploy key (unique path to avoid race with EC2 runner)
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/rag-deploy-key-opi
          chmod 600 ~/.ssh/rag-deploy-key-opi
          SSH_OPTS="-i ~/.ssh/rag-deploy-key-opi -o StrictHostKeyChecking=no"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          REMOTE_DIR="/home/${{ secrets.SSH_USER }}/rag-deploy"

          # Create remote dir
          ssh $SSH_OPTS "$REMOTE" "mkdir -p $REMOTE_DIR"

          # Sync project files
          rsync -avz -e "ssh $SSH_OPTS" \
            docker-compose.yml init.sql \
            "$REMOTE:$REMOTE_DIR/"

          # Write GCP Service Account JSON (printenv avoids shell quoting issues)
          printenv GCP_SA_KEY > /tmp/gcp-sa.json
          scp $SSH_OPTS /tmp/gcp-sa.json "$REMOTE:$REMOTE_DIR/gcp-sa.json"
          rm -f /tmp/gcp-sa.json

          # Write .env on remote
          ssh $SSH_OPTS "$REMOTE" "cat > $REMOTE_DIR/.env << 'EOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          PW=${{ secrets.PW }}
          SALESFORCE_INSTANCE_URL=${{ secrets.SALESFORCE_INSTANCE_URL }}
          SALESFORCE_CLIENT_ID=${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET=${{ secrets.SALESFORCE_CLIENT_SECRET }}
          KINTONE_SUBDOMAIN=${{ secrets.KINTONE_SUBDOMAIN }}
          KINTONE_API_TOKEN=${{ secrets.KINTONE_API_TOKEN }}
          KINTONE_APP_ID=${{ secrets.KINTONE_APP_ID }}
          APP_URL=${{ secrets.APP_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          USE_VERTEX_AI=true
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION=global
          GCP_SA_KEY_FILE=./gcp-sa.json
          EOF
          sed -i 's/^[[:space:]]*//' $REMOTE_DIR/.env"

          # Transfer images
          scp $SSH_OPTS /tmp/rag-images.tar "$REMOTE:$REMOTE_DIR/"

          # Deploy
          ssh $SSH_OPTS "$REMOTE" "
            cd $REMOTE_DIR
            docker load -i rag-images.tar
            rm rag-images.tar
            docker compose --profile prod pull postgres valkey
            docker compose --profile prod up -d
            echo ''
            docker compose --profile prod ps
          "

          # Cleanup
          rm -f /tmp/rag-images.tar ~/.ssh/rag-deploy-key-opi

  # ── EC2（会社 fg: FGjp-techdes/ai-agent-v2） ──
  deploy-ec2:
    if: github.repository == 'FGjp-techdes/ai-agent-v2'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: |
          docker compose --profile prod build
          docker build -f opensandbox/Dockerfile.sandbox-python -t sandbox-python:latest opensandbox/

      - name: Save images
        run: docker save -o /tmp/rag-images-ec2.tar rag-deploy-lightrag:latest rag-deploy-ui:latest rag-deploy-crm:latest rag-deploy-task-worker:latest rag-deploy-opensandbox:latest sandbox-python:latest

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # Write deploy key (unique path to avoid race with Orange Pi runner)
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/rag-deploy-key-ec2
          chmod 600 ~/.ssh/rag-deploy-key-ec2
          SSH_OPTS="-i ~/.ssh/rag-deploy-key-ec2 -o StrictHostKeyChecking=no"
          REMOTE="ec2-user@${{ secrets.EC2_HOST }}"
          REMOTE_DIR="/home/ec2-user/rag-deploy"

          # Create remote dir
          ssh $SSH_OPTS "$REMOTE" "mkdir -p $REMOTE_DIR"

          # Sync project files
          rsync -avz -e "ssh $SSH_OPTS" \
            docker-compose.yml init.sql \
            "$REMOTE:$REMOTE_DIR/"

          # Write GCP Service Account JSON
          printenv GCP_SA_KEY > /tmp/gcp-sa.json
          scp $SSH_OPTS /tmp/gcp-sa.json "$REMOTE:$REMOTE_DIR/gcp-sa.json"
          rm -f /tmp/gcp-sa.json

          # Write .env on remote
          ssh $SSH_OPTS "$REMOTE" "cat > $REMOTE_DIR/.env << 'EOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          PW=${{ secrets.PW }}
          SALESFORCE_INSTANCE_URL=${{ secrets.SALESFORCE_INSTANCE_URL }}
          SALESFORCE_CLIENT_ID=${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET=${{ secrets.SALESFORCE_CLIENT_SECRET }}
          KINTONE_SUBDOMAIN=${{ secrets.KINTONE_SUBDOMAIN }}
          KINTONE_API_TOKEN=${{ secrets.KINTONE_API_TOKEN }}
          KINTONE_APP_ID=${{ secrets.KINTONE_APP_ID }}
          APP_URL=${{ secrets.APP_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          USE_VERTEX_AI=true
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION=global
          GCP_SA_KEY_FILE=./gcp-sa.json
          EOF
          sed -i 's/^[[:space:]]*//' $REMOTE_DIR/.env"

          # Transfer images
          scp $SSH_OPTS /tmp/rag-images-ec2.tar "$REMOTE:$REMOTE_DIR/"

          # Deploy
          ssh $SSH_OPTS "$REMOTE" "
            cd $REMOTE_DIR
            docker load -i rag-images-ec2.tar
            rm rag-images-ec2.tar
            docker compose --profile prod pull postgres valkey
            docker compose --profile prod up -d
            echo ''
            docker compose --profile prod ps
          "

          # Cleanup
          rm -f /tmp/rag-images-ec2.tar ~/.ssh/rag-deploy-key-ec2
