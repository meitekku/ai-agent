[server]
host = "0.0.0.0"
port = 8080
log_level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.6"

[docker]
# bridge mode so sandbox containers can join the compose network
network_mode = "bridge"
# allows sandbox containers to reach compose services
host_ip = "host.docker.internal"
