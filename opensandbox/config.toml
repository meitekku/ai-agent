[server]
host = "0.0.0.0"
port = 8080
log_level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.6"

[docker]
# sandbox containers must be on the compose network so the SDK (task-worker) can reach them
network_mode = "rag-deploy_default"
# allows sandbox containers to reach compose services
host_ip = "host.docker.internal"
